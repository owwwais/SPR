# Deploys Supabase from GitHub, because the repository is worked on through
# github.com and there is no local machine running the CLI.
#
# The split is deliberate:
#
#   Edge Functions        -> automatic on push to main.
#                            Deploying is idempotent and a mistake is undone
#                            by pushing the previous code again.
#
#   Migrations            -> manual button only (Actions -> Run workflow).
#                            They alter data and several are not reversible,
#                            so a merge should never run one on its own.
#                            The live project's migrations were applied by
#                            hand in the SQL Editor, so the CLI's history
#                            table does not know them and `db push` would
#                            start again at 0001 and stop on its first
#                            statement. Until that history is repaired, check
#                            with supabase/scripts/deploy_check.sql and apply
#                            the missing files in the SQL Editor instead.
#
#   Expose talent schema  -> manual button only. This edits a PROJECT-LEVEL
#                            API gateway setting (which Postgres schemas
#                            PostgREST routes to at all) via the Supabase
#                            Management API, not a database migration — no
#                            migration can touch it, and it affects what the
#                            live project's REST API exposes immediately.
#                            One-time: run it once after the talent schema
#                            (0017) is deployed, not on every push.
name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "srp/supabase/functions/**"
      # config.toml and the auth templates are read by the CLI on every
      # deploy, so a change to either can break or fix one without touching a
      # function. Leaving them out meant a config fix merged to main and no
      # deploy ran.
      - "srp/supabase/config.toml"
      - "srp/supabase/templates/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:
    inputs:
      migrations:
        description: "Also apply pending database migrations"
        type: boolean
        default: false
      expose_talent_schema:
        description: "One-time: add 'talent' to the project's exposed API schemas"
        type: boolean
        default: false
      database:
        description: "Database: 'check' reports which migrations exist (read-only); 'apply' also applies the missing ones"
        type: choice
        options: [none, check, apply]
        default: none
      interview_secrets:
        description: "Interview agent secrets: 'check' lists which are set (names only); 'apply' sets the agent URL and, if missing, a new reference secret"
        type: choice
        options: [none, check, apply]
        default: none
      interview_agent_url:
        description: "With interview_secrets=apply: the interview agent's base URL (https://...)"
        type: string
        default: ""

concurrency:
  # Never let two deploys race against the same project.
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  # The interview gateway answers `interviews_not_configured` until three
  # Edge Function secrets exist: INTERVIEW_AGENT_URL, INTERVIEW_AGENT_KEYS
  # (the agent's PLATFORM_HMAC_KEYS) and INTERVIEW_REF_SECRET (32+ chars).
  # This job reads secret NAMES only — never values, digests included: this
  # repository's Action logs are public. 'apply' sets the URL from the input
  # and creates INTERVIEW_REF_SECRET only when it does not exist, because
  # changing it later re-keys every tenant's references on the agent. The
  # agent's shared key cannot be set from here: only its owner knows it.
  interview-secrets:
    name: Interview agent secrets (check / apply)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.interview_secrets != 'none'
    steps:
      - name: Check, set what can be set, check again
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MODE: ${{ inputs.interview_secrets }}
          AGENT_URL: ${{ inputs.interview_agent_url }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/secrets"
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          wanted="INTERVIEW_AGENT_URL INTERVIEW_AGENT_KEYS INTERVIEW_REF_SECRET INTERVIEW_WEBHOOK_SECRETS"

          names() {
            curl -sS --fail-with-body "${auth[@]}" "$api" | jq -r '.[].name'
          }
          report() {
            local present; present=$(names)
            for n in $wanted; do
              if grep -qx "$n" <<< "$present"; then echo "  set      $n"; else echo "  MISSING  $n"; fi
            done
          }

          echo "== interview secrets in Supabase"
          report
          if [ "$MODE" != "apply" ]; then exit 0; fi

          present=$(names)
          payload='[]'
          if [ -n "$AGENT_URL" ]; then
            if ! [[ "$AGENT_URL" =~ ^https://[A-Za-z0-9.-]+(/)?$ ]]; then
              echo "::error::interview_agent_url must be an https base URL"; exit 1
            fi
            payload=$(jq -c --arg v "${AGENT_URL%/}" '. + [{name:"INTERVIEW_AGENT_URL", value:$v}]' <<< "$payload")
            echo "will set INTERVIEW_AGENT_URL"
          fi
          if ! grep -qx INTERVIEW_REF_SECRET <<< "$present"; then
            # Never echoed, not even to mask it: masking would print it first.
            ref=$(openssl rand -hex 32)
            payload=$(jq -c --arg v "$ref" '. + [{name:"INTERVIEW_REF_SECRET", value:$v}]' <<< "$payload")
            echo "will create INTERVIEW_REF_SECRET (random, 64 hex characters, not shown)"
          else
            echo "INTERVIEW_REF_SECRET exists — left untouched (it must never change)"
          fi
          if [ "$payload" != "[]" ]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${auth[@]}" \
              -H "Content-Type: application/json" --data "$payload" "$api")
            if [ "$code" -ge 300 ]; then echo "::error::Setting secrets failed (HTTP $code)"; exit 1; fi
          fi

          echo "== interview secrets in Supabase, after"
          report
          if ! names | grep -qx INTERVIEW_AGENT_KEYS; then
            echo "::warning::INTERVIEW_AGENT_KEYS is still missing. Add it in Supabase (Edge Functions -> Secrets) as k1:<the secret in the agent's PLATFORM_HMAC_KEYS>."
          fi

  # The live project's migrations were applied by hand in the SQL Editor, so
  # `supabase db push` (the `migrations` box) cannot tell what is there. This
  # asks the database itself: supabase/scripts/deploy_check.sql reports, per
  # migration, whether its objects exist. 'apply' then sends each missing
  # file, oldest first, through the Management API's query endpoint. A file
  # is one query string, which Postgres runs as one implicit transaction, so
  # a failing file leaves nothing half-applied, and the job stops there.
  database:
    name: Database (check / apply missing migrations)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.database != 'none'
    steps:
      - uses: actions/checkout@v4

      - name: Check, apply what is missing, check again
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          MODE: ${{ inputs.database }}
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query"

          # Sends one SQL file; prints the JSON answer, fails on an HTTP error.
          run_sql() {
            jq -Rs '{query: .}' < "$1" > "$RUNNER_TEMP/body.json"
            code=$(curl -sS -o "$RUNNER_TEMP/resp.json" -w '%{http_code}' -X POST "$api" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/body.json")
            if [ "$code" -ge 300 ]; then
              echo "HTTP $code: $(cat "$RUNNER_TEMP/resp.json")" >&2
              return 1
            fi
            cat "$RUNNER_TEMP/resp.json"
          }

          check() {
            run_sql srp/supabase/scripts/deploy_check.sql > "$RUNNER_TEMP/check.json"
            jq -r '.[] | "\(.migration)  \(.status)"' "$RUNNER_TEMP/check.json"
          }

          echo "== migrations in the database"
          check
          missing=$(jq -r '.[] | select(.status != "applied") | .migration' "$RUNNER_TEMP/check.json")
          if [ -z "$missing" ]; then
            echo "Every migration is applied."
            exit 0
          fi
          echo "== missing:" $missing
          if [ "$MODE" != "apply" ]; then
            echo "Check only; nothing was changed."
            exit 0
          fi

          for m in $missing; do
            echo "== applying $m"
            if ! run_sql "srp/supabase/migrations/$m.sql" > /dev/null; then
              echo "::error title=$m failed::Rolled back; nothing after it was applied. See the HTTP error above."
              exit 1
            fi
          done

          echo "== migrations in the database, after"
          check
          if jq -e '[.[] | select(.status != "applied")] | length > 0' "$RUNNER_TEMP/check.json" > /dev/null; then
            echo "::error::Some migrations still report MISSING."
            exit 1
          fi

  functions:
    name: Edge Functions
    runs-on: ubuntu-latest
    # After the database when both run (functions read its new objects); on a
    # plain push the database job is skipped and this runs straight away. A
    # read-only 'check' deploys nothing: new functions must not go live ahead
    # of the migrations they need.
    needs: database
    if: ${{ !cancelled() && inputs.database != 'check' && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # An expired or revoked token otherwise fails inside the CLI with a bare
      # "401 Invalid access token", which is how two merges in October
      # deployed nothing without anyone noticing. Say what to do instead.
      - name: Check the access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects")
          if [ "$status" != "200" ]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN rejected (HTTP $status)::Nothing was deployed. Generate a new token at https://supabase.com/dashboard/account/tokens and replace the SUPABASE_ACCESS_TOKEN secret under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 1
          fi

      # No function name deploys every function under supabase/functions.
      # Directories starting with _ are skipped by the CLI, so _shared travels
      # with each bundle without being deployed as a function itself.
      - name: Deploy functions
        working-directory: srp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

  migrations:
    name: Database migrations
    runs-on: ubuntu-latest
    # Only ever on the manual button, and only when the box is ticked.
    if: github.event_name == 'workflow_dispatch' && inputs.migrations
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations
        working-directory: srp
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          supabase db push

  expose-talent-schema:
    name: Expose talent schema to the Data API
    runs-on: ubuntu-latest
    # The schema has to exist first (0017), so after the database job.
    needs: database
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.expose_talent_schema && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    steps:
      # migration 0017 created the talent schema deliberately UNEXPOSED —
      # public.talent_* wrapper functions were meant to be its only reachable
      # surface for anon/authenticated callers. But talent-upload and
      # talent-analyze call .schema("talent") directly via supabase-js, which
      # always goes through PostgREST regardless of using the service-role
      # key — PostgREST checks its own "exposed schemas" allowlist before a
      # request ever reaches Postgres or RLS. Without talent on that list,
      # every one of those calls fails with PGRST106 ("schema must be one of
      # the pre-configured schemas"), which is exactly the failure this step
      # exists to fix.
      #
      # This is safe to expose: every table in the schema has RLS enabled,
      # and only talent.skills grants anon/authenticated anything (an
      # intentional public read of the shared skill taxonomy) — the same
      # deny-by-default posture every table in `public` already relies on,
      # not schema-hiding. The service role the Edge Functions use bypasses
      # RLS as intended and never reaches the browser.
      #
      # config.toml's [api].schemas governs the LOCAL dev stack only — the
      # hosted project's exposed-schema list is project-level API gateway
      # config with no migration equivalent, set here via the Management API.
      - name: Add talent to exposed schemas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # NEVER print these responses: the PostgREST config carries the
          # project's jwt_secret, and this repository's Action logs are
          # public. Only db_schema is ever echoed.
          current=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest")
          db_schema=$(echo "$current" | jq -er '.db_schema')
          echo "exposed schemas: $db_schema"

          if echo ",$db_schema," | grep -q ",talent,"; then
            echo "talent is already exposed — nothing to do."
            exit 0
          fi

          new_schema="$db_schema,talent"
          echo "adding talent -> $new_schema"

          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"db_schema\": \"$new_schema\"}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest")
          if [ "$code" -ge 300 ]; then
            echo "::error::Updating the exposed schemas failed (HTTP $code)."
            exit 1
          fi
          echo "done — PostgREST reloads its schema cache within a few seconds."
