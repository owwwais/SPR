<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="utf-8" /><title>تأكيد بريدك الإلكتروني</title></head>
  <body style="margin:0;padding:24px;background:#f5f5f5;font-family:'IBM Plex Sans Arabic',-apple-system,'Segoe UI',Tahoma,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;direction:rtl;text-align:right;">
      <tr><td>
        <p style="margin:0 0 4px;font-size:20px;font-weight:700;color:#1c1c1c;">حكيم</p>
        <h1 style="margin:16px 0 8px;font-size:18px;font-weight:600;color:#1c1c1c;">تأكيد بريدك الإلكتروني</h1>
        <p style="margin:0 0 24px;font-size:15px;line-height:1.8;color:#444;">أهلاً بك. أنشئ حسابك في حكيم بتأكيد بريدك الإلكتروني عبر الزر أدناه.</p>
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1c1c1c;color:#fafafa;text-decoration:none;padding:12px 28px;border-radius:8px;font-size:15px;font-weight:600;">تأكيد البريد</a>

        <p style="margin:16px 0 0;font-size:12px;color:#999;word-break:break-all;">إن لم يعمل الزر، انسخ هذا الرابط: {{ .ConfirmationURL }}</p>
      </td></tr>
    </table>
